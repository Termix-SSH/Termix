services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8080"
      GUACD_HOST: "guacd"
      GUACD_TUNNEL_HOST: "termix"
      GUACD_RECORDING_PATH: "/termix-data/session_recordings/guacamole"
      # Which hops may set X-Forwarded-For, and therefore what Termix believes
      # the client address is in audit records and login lockouts. The default
      # ("loopback") already yields the real client address behind one extra
      # reverse proxy such as Traefik or Caddy. Only widen it if you run a
      # proxy chain whose own address must be skipped as well; every hop you
      # trust here is a hop that can claim to be someone else.
      # TRUSTED_PROXIES: "loopback,172.16.0.0/12"
      # Who may put the Termix UI in an iframe. Unset means no restriction,
      # because the desktop app signs in against a remote server by framing it.
      # Set it to switch clickjacking protection on; use "'self'" unless you
      # embed Termix in a dashboard, and note it will block that desktop login.
      # FRAME_ANCESTORS: "'self'"
      # Trusted reverse-proxy authentication is disabled by default. When
      # enabled, do not expose this container directly to untrusted clients.
      # TRUSTED_PROXY_AUTH_TRUSTED_PROXIES lists the proxies that are allowed
      # to assert a username - that is the proxy in front of Termix (e.g.
      # Traefik on the Docker network), not the container's own loopback.
      # TRUSTED_PROXY_AUTH_ENABLED: "true"
      # TRUSTED_PROXY_AUTH_TRUSTED_PROXIES: "172.16.0.0/12"
      # TRUSTED_PROXY_AUTH_ROLE_MAP: '{"operators":["user"]}'
      # TRUSTED_PROXY_AUTH_USERNAME_HEADER: "x-forwarded-username"
      # TRUSTED_PROXY_AUTH_ROLE_HEADER: "x-forwarded-role"
    depends_on:
      - guacd
    networks:
      - termix-net

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    volumes:
      - termix-data:/termix-data
    networks:
      - termix-net

volumes:
  termix-data:
    driver: local

networks:
  termix-net:
    driver: bridge
