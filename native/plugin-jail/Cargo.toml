[package]
name = "termix-plugin-jail"
version = "1.0.0"
edition = "2024"
publish = false
description = "Starts a Termix desktop plugin process inside an OS sandbox."
license = "Apache-2.0"

[[bin]]
name = "termix-plugin-jail"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemServices",
  "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
