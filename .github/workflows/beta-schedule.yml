name: Beta schedule

# Tuesday and Friday: start a beta from the newest dev branch when it moved
# since the last beta. Release runs from that branch, so the beta always uses
# the branch's own release steps, not the older ones on main.

on:
  schedule:
    - cron: "0 15 * * 2,5"

permissions: {}

concurrency:
  group: beta-schedule
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Start a beta if the dev branch moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REFS=$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name')
          if ! DEV_BRANCH=$(printf '%s\n' "$REFS" | node scripts/latest-dev-branch.cjs 2>/dev/null); then
            echo "No dev-X.Y.Z branch is open, so no beta today."
            exit 0
          fi

          BASE=$(node scripts/parse-dev-branch.cjs "$DEV_BRANCH")
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEV_BRANCH" -q .commit.sha)
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$BASE-beta." -q '.[].ref' | sed 's#^refs/tags/##')
          LATEST=$(printf '%s\n' "$TAGS" | node scripts/beta-version.cjs "$BASE" --latest)

          if [ -n "$LATEST" ]; then
            LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$LATEST" -q .sha)
            if [ "$LATEST_SHA" = "$SHA" ]; then
              echo "$DEV_BRANCH has not moved since $LATEST, so no beta today."
              exit 0
            fi
          fi

          echo "Starting a beta from $DEV_BRANCH @ $SHA"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEV_BRANCH" \
            -f channel=Beta -f mode=Everything
