name: Publish SDK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: Publish
        type: choice
        options:
          - Publish
          - Dry run

permissions: {}

jobs:
  publish:
    name: Publish @termix-ssh/plugin-sdk
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release, npm trusted publishing and build provenance.
      contents: write
      id-token: write
      attestations: write

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache in a job that publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted publishing needs npm 11.5 or newer, pinned to one release.
        run: npm install -g npm@11.21.2 # zizmor: ignore[adhoc-packages]

      - run: npm run ci:install

      - name: Check the version is new
        env:
          MODE: ${{ inputs.mode }}
        run: |
          VERSION=$(node -p "require('./packages/plugin-sdk/package.json').version")
          if npm view "@termix-ssh/plugin-sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@termix-ssh/plugin-sdk@$VERSION is already on npm. Bump packages/plugin-sdk/package.json first."
            if [ "$MODE" = "Publish" ]; then
              exit 1
            fi
          fi
          echo "Publishing @termix-ssh/plugin-sdk@$VERSION"

      - run: npm run build:sdk

      - run: npm run lint

      - run: npm run type-check

      - run: npm run test

      # npm publishes this exact tarball and the release carries it with its
      # provenance, so both are the same bytes.
      - name: Pack
        id: pack
        run: |
          mkdir sdk-release
          NAME=$(npm pack --workspace @termix-ssh/plugin-sdk --pack-destination sdk-release --json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          echo "tarball=./sdk-release/$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          MODE: ${{ inputs.mode }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ "$MODE" = "Dry run" ]; then
            npm publish "$TARBALL" --provenance --access public --dry-run
          else
            npm publish "$TARBALL" --provenance --access public
          fi

      - name: Attest build provenance
        id: provenance
        if: ${{ inputs.mode == 'Publish' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Tag and release
        if: ${{ inputs.mode == 'Publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          VERSION=$(node -p "require('./packages/plugin-sdk/package.json').version")
          cp "$BUNDLE" "$TARBALL.intoto.jsonl"
          node -e "
            const fs = require('fs');
            const { changelogSection } = require('./packages/plugin-sdk/dist/changelog.js');
            const notes = changelogSection(fs.readFileSync('packages/plugin-sdk/CHANGELOG.md', 'utf8'), process.argv[1]);
            fs.writeFileSync('sdk-notes.md', notes);
          " "$VERSION"
          gh release create "sdk-v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Plugin SDK v$VERSION" \
            --notes-file sdk-notes.md \
            --latest=false \
            "$TARBALL" "$TARBALL.intoto.jsonl"
