name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 26.10.0)"
        required: true
      build_type:
        description: "Build type"
        required: true
        default: "Development"
        type: choice
        options:
          - Development
          - Beta
          - Production
      source_ref:
        description: "Git ref/SHA to build (defaults to the workflow ref)"
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        description: "Version to build (e.g., 26.10.0)"
        required: true
        type: string
      build_type:
        description: "Build type (Development, Beta or Production)"
        required: true
        type: string
      dry_run:
        description: "Build the image but do not push to any registry"
        required: false
        type: boolean
        default: false
      source_ref:
        description: "Git ref/SHA to build"
        required: false
        type: string
        default: ""
    # The values come from the build environment.
    secrets:
      DOCKERHUB_BUGATTIGUY527_TOKEN:
        required: false
      DOCKERHUB_TERMIXSSH_TOKEN:
        required: false

permissions: {}

jobs:
  # One image per plugin profile (docker/bundled-plugins.json). standard keeps
  # the plain tags; minimal and full add a suffix.
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    environment: build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        profile: [standard, minimal, full]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve source revision
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # The image reads its version from package.json, so a beta has to say so.
      - name: Stamp beta version
        if: ${{ inputs.build_type == 'Beta' }}
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/sync-version.cjs --version "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Setup Docker Buildx
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2.3.0
        with:
          cache-key: termix-ssh/termix

      - name: Determine tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          PROFILE: ${{ matrix.profile }}
        run: |
          TAGS=()
          ALL_TAGS=()

          SUFFIX=""
          if [ "$PROFILE" != "standard" ]; then
            SUFFIX="-$PROFILE"
          fi

          if [ "$BUILD_TYPE" = "Production" ]; then
            TAGS+=("$VERSION$SUFFIX" "latest$SUFFIX")
          elif [ "$BUILD_TYPE" = "Beta" ]; then
            TAGS+=("beta$SUFFIX" "$VERSION$SUFFIX")
          else
            TAGS+=("dev-$VERSION$SUFFIX")
          fi

          for tag in "${TAGS[@]}"; do
            ALL_TAGS+=("ghcr.io/lukegus/termix:$tag")
            ALL_TAGS+=("ghcr.io/termix-ssh/termix:$tag")
            if [ "$BUILD_TYPE" != "Development" ]; then
              ALL_TAGS+=("docker.io/bugattiguy527/termix:$tag")
            fi
          done

          {
            echo "ALL_TAGS=$(IFS=,; echo "${ALL_TAGS[*]}")"
            echo "TAGS=${TAGS[*]}"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (prod and beta only)
        if: ${{ (inputs.build_type == 'Production' || inputs.build_type == 'Beta') && !inputs.dry_run }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: bugattiguy527
          password: ${{ secrets.DOCKERHUB_BUGATTIGUY527_TOKEN }}

      - name: Build and push multi-arch image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ !inputs.dry_run }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.ALL_TAGS }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
            PLUGIN_PROFILE=${{ matrix.profile }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_CREATED }}
          outputs: ${{ inputs.dry_run && 'type=cacheonly' || 'type=registry,compression=zstd' }}

      - name: Login to Docker Hub as termixssh
        id: termix_hub
        if: ${{ (inputs.build_type == 'Production' || inputs.build_type == 'Beta') && !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TERMIXSSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCKERHUB_TERMIXSSH_TOKEN is not set, skipping docker.io/termixssh"
            exit 0
          fi
          echo "$TOKEN" | docker login docker.io --username termixssh --password-stdin
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Copy image to docker.io/termixssh
        if: ${{ steps.termix_hub.outputs.ready == 'true' }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create --tag "docker.io/termixssh/termix:$tag" "ghcr.io/termix-ssh/termix:$tag"
          done

      - name: Cleanup Docker
        if: always()
        run: |
          docker image prune -af
          docker system prune -af --volumes
