name: Release

# Stable: run by hand from a dev-X.Y.Z branch. Beta: run by hand from a dev
# branch, or let the Tuesday and Friday schedule snapshot the newest dev
# branch when it moved since the last beta.

on:
  schedule:
    - cron: "0 15 * * 2,5"
  workflow_dispatch:
    inputs:
      channel:
        description: "Stable release or beta"
        required: true
        default: Stable
        type: choice
        options:
          - Stable
          - Beta
      mode:
        description: "Release mode (Overwrite release is stable only)"
        required: true
        default: Everything
        type: choice
        options:
          - Everything
          - Overwrite release
          - Dry run
          - Skip submit

# Writes go through the Termix CI App, so the job token mostly only reads.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prep:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.mode.outputs.channel }}
      mode: ${{ steps.mode.outputs.mode }}
      skip: ${{ steps.beta.outputs.skip || 'false' }}
      version: ${{ steps.info.outputs.version || steps.beta.outputs.version }}
      release_tag: ${{ steps.info.outputs.release_tag || steps.beta.outputs.release_tag }}
      mobile_version: ${{ steps.info.outputs.mobile_version }}
      mobile_tag: ${{ steps.info.outputs.mobile_tag }}
      dev_branch: ${{ steps.info.outputs.dev_branch || steps.beta.outputs.dev_branch }}
      sha: ${{ steps.beta.outputs.sha }}
      prev_ref: ${{ steps.beta.outputs.prev_ref }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix,Mobile
          permission-contents: read

      - name: Resolve channel and mode
        id: mode
        env:
          CHANNEL: ${{ inputs.channel || 'Beta' }}
          MODE: ${{ inputs.mode || 'Everything' }}
        run: |
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$CHANNEL" = "Beta" ] && [ "$MODE" = "Overwrite release" ]; then
            echo "Overwrite release is for stable releases only."
            exit 1
          fi

      - name: Guard branch (release modes)
        if: ${{ github.event_name == 'workflow_dispatch' && steps.mode.outputs.mode != 'Overwrite release' && !startsWith(github.ref, 'refs/heads/dev-') }}
        run: |
          echo "This mode must be run from a dev branch (got $GITHUB_REF)."
          exit 1

      - name: Guard branch (overwrite mode)
        if: ${{ steps.mode.outputs.mode == 'Overwrite release' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Overwrite release must be run from main (got $GITHUB_REF)."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Resolve versions
        id: info
        if: ${{ steps.mode.outputs.channel == 'Stable' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$MODE" = "Overwrite release" ]; then
            DEV_BRANCH=""
            VERSION=$(node -p "require('./package.json').version")
          else
            DEV_BRANCH="${GITHUB_REF#refs/heads/}"
            VERSION=$(node scripts/parse-dev-branch.cjs "$DEV_BRANCH")
          fi
          {
            echo "dev_branch=$DEV_BRANCH"
            echo "version=$VERSION"
            echo "release_tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

          MOBILE_RAW=$(gh release view -R Termix-SSH/Mobile --json tagName -q .tagName)
          MOBILE_VERSION=$(echo "$MOBILE_RAW" | sed -E 's/^release-//; s/-tag$//; s/^v//')
          if [ -z "$MOBILE_VERSION" ]; then
            echo "Failed to resolve the latest Termix-SSH/Mobile release version."
            exit 1
          fi
          {
            echo "mobile_version=$MOBILE_VERSION"
            echo "mobile_tag=$MOBILE_RAW"
          } >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG.md has notes for this version
        if: ${{ steps.mode.outputs.channel == 'Stable' }}
        env:
          VERSION: ${{ steps.info.outputs.version }}
          MOBILE_VERSION: ${{ steps.info.outputs.mobile_version }}
          MOBILE_TAG: ${{ steps.info.outputs.mobile_tag }}
        run: |
          node scripts/generate-release-body.cjs \
            --version "$VERSION" \
            --mobile-version "$MOBILE_VERSION" \
            --mobile-tag "$MOBILE_TAG" > /dev/null

      - name: Resolve beta version
        id: beta
        if: ${{ steps.mode.outputs.channel == 'Beta' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            REFS=$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name')
            if ! DEV_BRANCH=$(printf '%s\n' "$REFS" | node scripts/latest-dev-branch.cjs 2>/dev/null); then
              echo "No dev-X.Y.Z branch is open, so no beta today."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            DEV_BRANCH="${GITHUB_REF#refs/heads/}"
          fi

          BASE=$(node scripts/parse-dev-branch.cjs "$DEV_BRANCH")
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEV_BRANCH" -q .commit.sha)
          TAGS=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$BASE-beta." -q '.[].ref' | sed 's#^refs/tags/##')
          LATEST=$(printf '%s\n' "$TAGS" | node scripts/beta-version.cjs "$BASE" --latest)
          VERSION=$(printf '%s\n' "$TAGS" | node scripts/beta-version.cjs "$BASE")

          if [ -n "$LATEST" ]; then
            LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$LATEST" -q .sha)
            if [ "$LATEST_SHA" = "$SHA" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "$DEV_BRANCH has not moved since $LATEST, so no beta today."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PREV="$LATEST"
          else
            PREV=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          fi

          echo "Beta $VERSION from $DEV_BRANCH @ $SHA, changes since ${PREV:-nothing}"
          {
            echo "skip=false"
            echo "dev_branch=$DEV_BRANCH"
            echo "version=$VERSION"
            echo "release_tag=v$VERSION"
            echo "sha=$SHA"
            echo "prev_ref=$PREV"
          } >> "$GITHUB_OUTPUT"

  # Translates new or changed strings with the Termix LLM server and pins the
  # bundled plugins to their newest registry releases, then commits both to the
  # dev branch so the beta or stable build includes them. If the server is down
  # it warns and the release goes on with what is there.
  translate:
    needs: [prep]
    if: ${{ needs.prep.outputs.skip != 'true' && needs.prep.outputs.mode != 'Overwrite release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      MODE: ${{ needs.prep.outputs.mode }}
      DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Checkout dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.sha || needs.prep.outputs.dev_branch }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}
          # The commit step pushes with it.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Translate
        uses: Termix-SSH/Termix-Registry/translate@main
        with:
          source: src/ui/locales/en.json
          out: src/ui/locales/translated
          languages: src/ui/locales/languages.json
          api-key: ${{ secrets.TERMIX_LLM_API_KEY }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Newest stable plugin release whose engine.termix allows this version.
      - name: Pin bundled plugins
        run: node scripts/pin-bundled-plugins.cjs --all --core-version "$VERSION"

      - name: Commit translations and plugin pins
        id: commit
        run: |
          git add src/ui/locales docker/bundled-plugins.json
          if git diff --cached --quiet; then
            echo "No translation changes."
          elif [ "$MODE" = "Dry run" ]; then
            echo "DRY RUN: would commit these translation and pin changes:"
            git --no-pager diff --cached --stat
          else
            git config user.name "LukeGus"
            git config user.email "bugattiguy527@gmail.com"
            git commit -m "chore: update translations and plugin pins"
            git push origin HEAD:"$DEV_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-beta:
    needs: [prep, translate]
    if: ${{ needs.prep.outputs.channel == 'Beta' && needs.prep.outputs.skip != 'true' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout beta commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.translate.outputs.sha || needs.prep.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm run ci:install

      # Bundled plugins are counted as downloads in the plugin store, so a
      # build only fetches them when the pins change.
      - name: Cache bundled plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/termix-bundled-plugins
          key: bundled-plugins-${{ hashFiles('docker/bundled-plugins.json') }}
          enableCrossOsArchive: true

      - name: Build plugin SDK
        run: npm run build:sdk

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test

  normalize:
    needs: [prep, translate]
    if: ${{ needs.prep.outputs.channel == 'Stable' && needs.prep.outputs.mode != 'Overwrite release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      MODE: ${{ needs.prep.outputs.mode }}
      DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write
          permission-workflows: write

      - name: Checkout dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.dev_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          # Pushes back to the dev branch.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm run ci:install

      # Manifest validation in lint loads the built SDK.
      - name: Build SDK
        run: npm run build:sdk

      - name: Lint and format
        run: |
          npm run lint:fix
          npm run format
          npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Sync version
        run: node scripts/sync-version.cjs --version "$VERSION"

      - name: Commit changes to dev branch
        run: |
          git config user.name "LukeGus"
          git config user.email "bugattiguy527@gmail.com"

          if git diff --quiet; then
            echo "No lint/format/version changes to commit."
            exit 0
          fi

          if [ "$MODE" = "Dry run" ]; then
            echo "DRY RUN: would commit and push the following changes to $DEV_BRANCH:"
            git --no-pager diff --stat
            exit 0
          fi

          git add -A
          git commit -m "chore: lint, format, and bump version to $VERSION"
          git push origin HEAD:"$DEV_BRANCH"

  sync-main:
    needs: [prep, normalize]
    if: ${{ needs.prep.outputs.channel == 'Stable' && needs.prep.outputs.mode != 'Dry run' && needs.prep.outputs.mode != 'Overwrite release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write
          permission-workflows: write

      - name: Checkout dev branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prep.outputs.dev_branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          # Pushes back to the dev branch.
          persist-credentials: true

      - name: Merge main into dev branch
        run: |
          git config user.name "LukeGus"
          git config user.email "bugattiguy527@gmail.com"
          git fetch origin main
          # -X ours leaves modify/delete conflicts, so settle those to the dev side too
          if ! git merge origin/main -X ours --no-edit; then
            git diff --name-only --diff-filter=U | while read -r f; do
              if git cat-file -e "HEAD:$f" 2>/dev/null; then
                git checkout --ours -- "$f" && git add -- "$f"
              else
                git rm -q -- "$f"
              fi
            done
            git commit --no-edit
          fi
          git push origin HEAD:"$DEV_BRANCH"

  merge-to-main:
    needs: [prep, translate, normalize, sync-main]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.channel == 'Stable' && (needs.translate.result == 'success' || needs.translate.result == 'skipped') && (needs.normalize.result == 'success' || needs.normalize.result == 'skipped') && (needs.sync-main.result == 'success' || needs.sync-main.result == 'skipped') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      MODE: ${{ needs.prep.outputs.mode }}
      DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
      MOBILE_VERSION: ${{ needs.prep.outputs.mobile_version }}
      MOBILE_TAG: ${{ needs.prep.outputs.mobile_tag }}
    outputs:
      main_sha: ${{ steps.merge.outputs.main_sha }}
      build_ref: ${{ steps.merge.outputs.build_ref }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate PR body
        id: body
        run: |
          node scripts/generate-release-body.cjs \
            --version "$VERSION" \
            --mobile-version "$MOBILE_VERSION" \
            --mobile-tag "$MOBILE_TAG" > PR_BODY.md

      - name: Open and squash-merge PR to main
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          TITLE="v$VERSION"

          if [ "$MODE" = "Overwrite release" ]; then
            echo "OVERWRITE: no merge; building from main as-is."
            echo "build_ref=main" >> "$GITHUB_OUTPUT"
            echo "main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MODE" = "Dry run" ]; then
            echo "DRY RUN: would open and squash-merge a PR from $DEV_BRANCH into main."
            echo "DRY RUN: downstream jobs will build from $DEV_BRANCH instead of main."
            {
              echo "build_ref=$DEV_BRANCH"
              echo "main_sha="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$DEV_BRANCH" --base main --state open --json number -q '.[0].number' || true)
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main --head "$DEV_BRANCH" \
              --title "$TITLE" --body-file PR_BODY.md \
              | grep -oE '[0-9]+$')
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --admin

          STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          if [ "$STATE" != "MERGED" ]; then
            echo "PR #$PR_NUMBER did not merge (state: $STATE)."
            exit 1
          fi

          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          {
            echo "main_sha=$MAIN_SHA"
            echo "build_ref=$MAIN_SHA"
          } >> "$GITHUB_OUTPUT"

  docker:
    needs: [prep, translate, verify-beta, merge-to-main]
    if: ${{ always() && needs.prep.result == 'success' && needs.prep.outputs.skip != 'true' && (needs.merge-to-main.result == 'success' || needs.verify-beta.result == 'success') }}
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prep.outputs.version }}
      build_type: ${{ needs.prep.outputs.channel == 'Beta' && 'Beta' || 'Production' }}
      dry_run: ${{ needs.prep.outputs.mode == 'Dry run' }}
      source_ref: ${{ needs.merge-to-main.outputs.build_ref || needs.translate.outputs.sha || needs.prep.outputs.sha }}
    secrets:
      DOCKERHUB_BUGATTIGUY527_TOKEN: ${{ secrets.DOCKERHUB_BUGATTIGUY527_TOKEN }}
      DOCKERHUB_TERMIXSSH_TOKEN: ${{ secrets.DOCKERHUB_TERMIXSSH_TOKEN }}

  create-release:
    needs: [prep, merge-to-main, docker]
    if: ${{ always() && needs.prep.outputs.channel == 'Stable' && needs.docker.result == 'success' && needs.prep.outputs.mode != 'Dry run' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      TAG: ${{ needs.prep.outputs.release_tag }}
      MOBILE_VERSION: ${{ needs.prep.outputs.mobile_version }}
      MOBILE_TAG: ${{ needs.prep.outputs.mobile_tag }}
      MAIN_SHA: ${{ needs.merge-to-main.outputs.main_sha }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Clear existing release artifacts (overwrite mode)
        if: ${{ needs.prep.outputs.mode == 'Overwrite release' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Overwrite release: no existing release $TAG to overwrite."
            exit 1
          fi
          echo "Clearing existing assets from $TAG..."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | while read -r ASSET; do
            [ -n "$ASSET" ] && gh release delete-asset "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --yes || true
          done

      - name: Generate release body
        if: ${{ needs.prep.outputs.mode != 'Overwrite release' }}
        run: |
          node scripts/generate-release-body.cjs \
            --version "$VERSION" \
            --mobile-version "$MOBILE_VERSION" \
            --mobile-tag "$MOBILE_TAG" > RELEASE_BODY.md

      - name: Create or update GitHub release
        if: ${{ needs.prep.outputs.mode != 'Overwrite release' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          TITLE="Termix v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file RELEASE_BODY.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file RELEASE_BODY.md --target "$MAIN_SHA"
          fi

  create-beta-release:
    needs: [prep, translate, docker]
    if: ${{ always() && needs.prep.outputs.channel == 'Beta' && needs.docker.result == 'success' && needs.prep.outputs.mode != 'Dry run' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prep.outputs.version }}
      TAG: ${{ needs.prep.outputs.release_tag }}
      DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
      BETA_SHA: ${{ needs.translate.outputs.sha || needs.prep.outputs.sha }}
      PREV_REF: ${{ needs.prep.outputs.prev_ref }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Checkout beta commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.translate.outputs.sha || needs.prep.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate beta release body
        run: |
          node scripts/generate-beta-body.cjs \
            --version "$VERSION" \
            --branch "$DEV_BRANCH" \
            --sha "$BETA_SHA" \
            --prev "$PREV_REF" > BETA_BODY.md

      - name: Create beta release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          TITLE="Termix v${VERSION%-beta.*} Beta ${VERSION##*-beta.}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file BETA_BODY.md --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --notes-file BETA_BODY.md \
              --prerelease --target "$BETA_SHA"
          fi

  electron-release:
    needs:
      [
        prep,
        translate,
        merge-to-main,
        docker,
        create-release,
        create-beta-release,
      ]
    if: ${{ always() && needs.prep.outputs.skip != 'true' && needs.docker.result == 'success' && needs.create-release.result != 'failure' && needs.create-beta-release.result != 'failure' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/electron.yml
    with:
      build_type: all
      artifact_destination: ${{ needs.prep.outputs.mode == 'Dry run' && 'file' || 'release' }}
      release_tag: ${{ needs.prep.outputs.release_tag }}
      version_override: ${{ needs.prep.outputs.channel == 'Beta' && needs.prep.outputs.version || '' }}
      source_ref: ${{ needs.merge-to-main.outputs.build_ref || needs.translate.outputs.sha || needs.prep.outputs.sha }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      MAC_BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
      MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
      MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}

  flatpak:
    needs: [prep, electron-release]
    if: ${{ always() && needs.electron-release.result == 'success' && needs.prep.outputs.mode != 'Dry run' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/flatpak.yml
    with:
      release_tag: ${{ needs.prep.outputs.release_tag }}
      publish: ${{ needs.prep.outputs.channel == 'Stable' }}
    secrets:
      FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}

  electron-submit:
    needs: [prep, merge-to-main, electron-release]
    if: ${{ always() && needs.electron-release.result == 'success' && needs.prep.outputs.channel == 'Stable' && needs.prep.outputs.mode != 'Dry run' && needs.prep.outputs.mode != 'Skip submit' }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/electron.yml
    with:
      build_type: all
      artifact_destination: submit
      source_ref: ${{ needs.merge-to-main.outputs.build_ref }}
    secrets:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
      APPLE_KEY_CONTENT: ${{ secrets.APPLE_KEY_CONTENT }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      MAC_BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_BASE64 }}
      MAC_KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
      MAC_P12_PASSWORD: ${{ secrets.MAC_P12_PASSWORD }}

  cask-commit-back:
    needs: [prep, electron-release]
    if: ${{ always() && needs.electron-release.result == 'success' && needs.prep.outputs.channel == 'Stable' && needs.prep.outputs.mode != 'Dry run' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions:
      contents: read
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}
          # Pushes the cask bump to main.
          persist-credentials: true

      - name: Bump and commit Homebrew cask
        env:
          VERSION: ${{ needs.prep.outputs.version }}
          DMG_SHA256: ${{ needs.electron-release.outputs.macos_universal_dmg_sha256 }}
        run: |
          if [ -z "$DMG_SHA256" ]; then
            echo "No universal DMG checksum available (macOS build unsigned or skipped); leaving cask unchanged."
            exit 0
          fi

          git config user.name "LukeGus"
          git config user.email "bugattiguy527@gmail.com"

          git fetch origin main
          git checkout -B main origin/main

          sed -i "s|version \".*\"|version \"$VERSION\"|g" Casks/termix.rb
          sed -i "s|sha256 \".*\"|sha256 \"$DMG_SHA256\"|g" Casks/termix.rb

          git add Casks/termix.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi

          git commit -m "chore: bump Homebrew cask to $VERSION"
          git push origin HEAD:main

  prune-betas:
    needs: [prep, create-release]
    if: ${{ always() && needs.prep.outputs.channel == 'Stable' && needs.create-release.result == 'success' && needs.prep.outputs.mode != 'Overwrite release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions: {}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Delete this version's beta releases (tags stay)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PREFIX: v${{ needs.prep.outputs.version }}-beta.
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "$PREFIX" | while read -r TAG; do
              echo "Deleting release $TAG"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            done

  # The docs site reads the env catalog, API spec and download list from the
  # newest stable release.
  # Docs written for this release live on dev-X.Y.Z in the Docs repo. Squash
  # merge it into main once the release is out. No branch means nothing to do.
  docs-merge:
    needs: [prep, electron-release]
    if: ${{ always() && needs.prep.outputs.channel == 'Stable' && needs.electron-release.result == 'success' && needs.prep.outputs.mode != 'Dry run' && needs.prep.outputs.mode != 'Overwrite release' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions: {}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Docs
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge the docs dev branch into main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: Termix-SSH/Docs
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          BRANCH="dev-$VERSION"
          if ! gh api "repos/$REPO/branches/$BRANCH" > /dev/null 2>&1; then
            echo "$REPO has no $BRANCH branch, nothing to merge."
            exit 0
          fi

          AHEAD=$(gh api "repos/$REPO/compare/main...$BRANCH" -q .ahead_by)
          if [ "$AHEAD" = "0" ]; then
            echo "$BRANCH has nothing main doesn't, deleting it."
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
              --title "v$VERSION" --body "Docs for Termix v$VERSION." | grep -oE '[0-9]+$')
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --admin --delete-branch

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state -q .state)
          if [ "$STATE" != "MERGED" ]; then
            echo "Docs PR #$PR_NUMBER did not merge (state: $STATE)."
            exit 1
          fi

  docs-refresh:
    needs: [prep, electron-release, docs-merge]
    if: ${{ always() && needs.prep.outputs.channel == 'Stable' && needs.electron-release.result == 'success' && needs.prep.outputs.mode != 'Dry run' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions: {}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Docs
          permission-contents: write

      - name: Tell the docs site
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api repos/Termix-SSH/Docs/dispatches -f event_type=core-released

  cleanup:
    needs: [prep, merge-to-main, electron-release, cask-commit-back]
    if: ${{ always() && needs.prep.outputs.channel == 'Stable' && (needs.prep.outputs.mode == 'Everything' || needs.prep.outputs.mode == 'Skip submit') && needs.merge-to-main.result == 'success' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: build
    permissions: {}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Termix
          permission-contents: write

      - name: Delete dev branch in Termix
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          DEV_BRANCH: ${{ needs.prep.outputs.dev_branch }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$DEV_BRANCH" || true
