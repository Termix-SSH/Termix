name: Beta feedback
description: A bug or feedback on a weekly beta build
labels: [bug, beta]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing a beta. Betas are weekly snapshots of active development (the `:beta` Docker tag and a rolling pre-release here), so things will break sometimes.
  - type: input
    id: termix-version
    attributes:
      label: Beta build
      description: Your image tag, or the version in Settings under About.
      placeholder: "e.g. 26.10.0-beta.20261005"
    validations:
      required: true
  - type: dropdown
    id: regression
    attributes:
      label: Does this happen on the latest stable release?
      description: Check stable too if you can.
      options:
        - "Not tested on stable"
        - "Yes, it happens on stable too"
        - "No, only on this beta"
        - "Not applicable, this is a new beta feature"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where do you see the problem?
      options:
        - "Web browser"
        - "Desktop app (Windows)"
        - "Desktop app (macOS)"
        - "Desktop app (Linux)"
        - "Mobile app (iOS)"
        - "Mobile app (Android)"
        - "Other"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Server install
      description: How is the Termix server installed?
      options:
        - "Docker"
        - "Manual build"
        - "Proxmox community script"
        - "Desktop app (built-in server)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug or feedback. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As few steps as you can.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, plus anything special about your setup.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Errors from the browser console, `docker logs termix`, or the error Termix shows. This is shown as code, so no backticks needed.
      render: text
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, config, or anything that might help.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched open and closed issues and this is not a duplicate
          required: true
        - label: I am on the latest version, or I said which version I am on
          required: true
        - label: I understand beta builds are not stable
          required: true
