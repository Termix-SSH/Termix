project_id: "858252"
api_token: "env:CROWDIN_API_TOKEN"
preserve_hierarchy: true

files:
  # Core has always lived at /en.json in Crowdin; moving it would orphan its translations.
  - source: /src/ui/locales/en.json
    dest: /en.json
    translation: /src/ui/locales/translated/%locale_with_underscore%.json
  - source: /plugins/*/locales/en.json
    translation: /%original_path%/translated/%locale_with_underscore%.json
