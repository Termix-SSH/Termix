<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termix plugin</title>
    <style>
      html:not([data-frame-shown]),
      html:not([data-frame-shown]) body {
        background: transparent !important;
      }
      #frame-loading {
        display: none;
      }
      html[data-frame-loading]:not([data-frame-shown]) #frame-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        opacity: 0;
        animation: frame-loading-in 0.2s 0.3s forwards;
      }
      #frame-loading svg {
        width: 20px;
        height: 20px;
        animation: frame-loading-spin 1s linear infinite;
      }
      @keyframes frame-loading-in {
        to {
          opacity: 0.6;
        }
      }
      @keyframes frame-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="frame-loading" role="status">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/ui/plugin-frame/frame-main.ts"></script>
  </body>
</html>
