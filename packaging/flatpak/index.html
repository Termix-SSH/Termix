      <h1>Termix Flatpak</h1>
      <p>Self-hosted, plugin-based server management.</p>
      <p>Install Termix from this repo:</p>
      <pre>
flatpak install --user --from https://flatpak.termix.site/com.karmaa.termix.flatpakref
flatpak run com.karmaa.termix</pre>
      <p>
        <code>flatpak update</code> keeps it up to date. More in the
        <a href="https://docs.termix.site/install/apps/linux">install guide</a>.
      </p>
    </main>
