app-id: com.karmaa.termix
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "26.08"
command: run.sh
separate-locales: false

finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --socket=ssh-auth
  - --socket=session-bus
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.portal.Desktop
  - --env=ELECTRON_TRASH=gio
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: termix
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - rm -f app/chrome-sandbox
      - mkdir -p /app/termix
      - cp -a app/. /app/termix/
      - install -Dm755 run.sh /app/bin/run.sh
      - install -Dm644 com.karmaa.termix.desktop /app/share/applications/com.karmaa.termix.desktop
      - install -Dm644 com.karmaa.termix.metainfo.xml /app/share/metainfo/com.karmaa.termix.metainfo.xml
      - install -Dm644 com.karmaa.termix.svg /app/share/icons/hicolor/scalable/apps/com.karmaa.termix.svg
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.karmaa.termix.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.karmaa.termix.png

    sources:
      - type: archive
        path: termix-x86_64.tar.gz
        dest: app
        only-arches:
          - x86_64

      - type: archive
        path: termix-aarch64.tar.gz
        dest: app
        only-arches:
          - aarch64

      - type: script
        dest-filename: run.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/termix/termix "$@"

      - type: file
        path: com.karmaa.termix.desktop

      - type: file
        path: com.karmaa.termix.metainfo.xml

      - type: file
        path: com.karmaa.termix.svg

      - type: file
        path: icon-256.png

      - type: file
        path: icon-128.png
